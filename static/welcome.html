<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugLens</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="report-page">
  <main class="report-card welcome">
    <div class="welcome-logo">🐛</div>
    <h1>BugLens</h1>
    <p class="muted">Turning messy feedback into actionable tickets.</p>

    <div class="choices">
      <a class="choice" href="/report">
        <span class="choice-icon">💬</span>
        <span>
          <strong>Report a problem</strong>
          <span class="muted">Something not working? Tell us in your own words.</span>
        </span>
      </a>
      <a class="choice" href="/team">
        <span class="choice-icon">🛠️</span>
        <span>
          <strong>Team login</strong>
          <span class="muted">For the team that sorts and fixes bugs.</span>
        </span>
      </a>
    </div>
  </main>
</body>
</html>
